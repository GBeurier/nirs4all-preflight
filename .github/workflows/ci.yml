name: Rust protocols
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all-methods
          ref: v1.4.1 # Methods 1.4.1 (ABI 2.24): spectral_population_events_qc
          path: upstream-methods
      - run: cmake --preset dev-release && cmake --build --preset dev-release --target n4m_c --parallel 2
        working-directory: upstream-methods
      - run: cargo test --workspace
        env:
          N4M_LIBRARY_PATH: ${{ github.workspace }}/upstream-methods/build/dev-release/cpp/src/libn4m.so
      - run: cargo run -p nirs4all-preflight-cli -- validate examples/first_run.json
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: npm ci --prefix bindings/wasm
      - run: npm run build:native --prefix bindings/wasm
      - run: npm test --prefix bindings/wasm
      - run: npm ci --prefix demo
      - run: npm test --prefix demo
      - run: npm run build --prefix demo
      - name: Demo browser smokes
        env:
          CHROME: /usr/bin/google-chrome
          SMOKE_URL: http://127.0.0.1:4173/nirs4all-preflight/
        run: |
          npm run preview --prefix demo -- --port 4173 --strictPort --host 127.0.0.1 &
          for attempt in $(seq 1 60); do curl -sf "$SMOKE_URL" > /dev/null && break; sleep 1; done
          npm run test:browser --prefix demo
          node demo/scripts/review-smoke.mjs

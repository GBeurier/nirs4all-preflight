name: Rust protocols
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all-methods
          ref: 131a15a6bbf73a8ab941c7b3fb81b21f6b71b059
          path: upstream-methods
      - run: cmake --preset dev-release && cmake --build --preset dev-release --target n4m_c --parallel 2
        working-directory: upstream-methods
      - run: cargo test --workspace
        env:
          N4M_LIBRARY_PATH: ${{ github.workspace }}/upstream-methods/build/dev-release/cpp/src/libn4m.so
      - run: cargo run -p nirs4all-preflight-cli -- validate examples/first_run.json
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: npm ci --prefix bindings/wasm
      - run: npm run build:native --prefix bindings/wasm
      - run: npm test --prefix bindings/wasm

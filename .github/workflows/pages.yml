name: Browser demo
on:
  push:
    branches: [main]
    paths: [demo/**, bindings/wasm/**, crates/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - uses: actions/configure-pages@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm ci --prefix bindings/wasm
      - run: npm run build:native --prefix bindings/wasm
      - run: npm ci --prefix demo
      - run: npm test --prefix demo
      - run: npm run build --prefix demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

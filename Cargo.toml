[workspace]
resolver = "2"
members = ["crates/nirs4all-preflight-core", "crates/nirs4all-preflight", "crates/nirs4all-preflight-cli", "crates/nirs4all-preflight-capi"]
exclude = ["bindings/wasm", "bindings/python-native", "crates/nirs4all-preflight-dagml"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
repository = "https://github.com/GBeurier/nirs4all-preflight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

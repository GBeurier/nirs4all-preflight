[package]
name = "nirs4all-preflight-dagml"
version = "0.1.0"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
repository = "https://github.com/GBeurier/nirs4all-preflight"
description = "DAG-ML validation provider (nested grouped probe) for nirs4all-preflight"
# Requires the unreleased dag-ml `nested_selection` module (branch
# feat/preflight-probe) from a sibling dag-ml checkout. Excluded from the
# workspace until a published dag-ml-core carries it.
publish = false

[[bin]]
name = "n4pf-dagml"
path = "src/main.rs"

[dependencies]
nirs4all-preflight = { path = "../nirs4all-preflight", version = "=0.1.0" }
dag-ml-core = { path = "../../../dag-ml/crates/dag-ml-core", features = ["methods-optimizer"] }
serde_json = "1"
sha2 = "0.10"

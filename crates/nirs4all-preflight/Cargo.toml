[package]
name = "nirs4all-preflight"
version = "0.1.1"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
repository = "https://github.com/GBeurier/nirs4all-preflight"
readme = "README.md"
description = "NIRS dataset qualification engine"

[dependencies]
nirs4all-preflight-core = { path = "../nirs4all-preflight-core", version = "=0.1.1" }
serde_json = "1"
sha2 = "0.10"
# Nested grouped selection (`nested_selection`) is first published in 0.3.42.
dag-ml-core = { version = "0.3.43", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
dag-ml-core = { version = "0.3.43", default-features = false, features = ["methods-optimizer"] }

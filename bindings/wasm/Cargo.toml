[package]
name = "nirs4all-preflight-wasm"
version = "0.1.1"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
repository = "https://github.com/GBeurier/nirs4all-preflight"
description = "WebAssembly binding for nirs4all qualification protocols"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nirs4all-preflight = { path = "../../crates/nirs4all-preflight", version = "=0.1.1" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
